name: Build apps

# Builds the Windows installer and Android app on GitHub's machines and
# publishes them on the repo's Releases page as ready-to-install downloads.
# Runs on every push to main, or manually: Actions tab -> "Build apps" -> Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: sitekeep-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Use the Android SDK and NDK already installed on the runner
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK}}"
          if [ -z "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          echo "Android SDK: $ANDROID_HOME"
          echo "Android NDK: $NDK"
          test -d "$NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Create Android project (if not committed)
        run: |
          if [ ! -d src-tauri/gen/android ]; then npx tauri android init --ci; fi
      - name: Build APK (debug-signed, installable by sideloading)
        run: npx tauri android build --apk --debug --ci
      - uses: actions/upload-artifact@v4
        with:
          name: sitekeep-android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  release:
    needs: [windows, android]
    # Publish whatever built, so a problem on one platform doesn't block the other.
    if: ${{ always() && (needs.windows.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Give the files friendly names
        run: |
          mkdir release
          find out -name '*-setup.exe' -exec cp {} release/SiteKeep-Windows-Setup.exe \;
          find out -name '*.msi' -exec cp {} release/SiteKeep-Windows.msi \;
          find out -name '*.apk' | head -1 | xargs -r -I{} cp {} release/SiteKeep-Android.apk
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SiteKeep build ${{ github.run_number }}
          make_latest: true
          body: |
            Download and install:
            - **Windows:** SiteKeep-Windows-Setup.exe (if Windows shows "Windows protected your PC", choose More info, then Run anyway)
            - **Android:** SiteKeep-Android.apk (open it on your phone and allow installing from this source)
          files: release/*
